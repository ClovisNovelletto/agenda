<div class="page" >
  <mat-toolbar color="primary" class="toolbar">
  <!--    
    <button mat-icon-button class="btn-voltar" (click)="fechar()">
      <mat-icon>arrow_back</mat-icon>
    </button>
  -->
    <span class="titulo">Minhas Anamneses</span>
    <span class="spacer"></span>


  </mat-toolbar>

  <!--<div class="container">-->
  <div class="agenda-layout" >

    
    <main class="content">

      <div class="tabela-container">
        <table mat-table [dataSource]="[]" class="tabela-header">
            <ng-container matColumnDef="data">
                <th mat-header-cell *matHeaderCellDef>Data</th>
            </ng-container>

            <ng-container matColumnDef="titulo">
                <th mat-header-cell *matHeaderCellDef>Título</th>
            </ng-container>

            <ng-container matColumnDef="descricao">
                <th mat-header-cell *matHeaderCellDef>Descrição</th>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['data','titulo','descricao']" style="height: 32px !important;"></tr>
        </table>
      
        <div class="loading" *ngIf="carregandoAnamneses">
          <mat-progress-spinner mode="indeterminate" diameter="32"></mat-progress-spinner>
        </div>

        <table mat-table [dataSource]="dataSource" *ngIf="!carregandoAnamneses">

            <ng-container matColumnDef="data">
                <td mat-cell *matCellDef="let row" class="corFonte">
                {{ toDate(row.data) | date:'dd/MM/yy' }} 
                <button
                  mat-icon-button
                  class="pdf-icon"
                  matTooltip="Gerar PDF"
                  (click)="generateAnamnesePDF(row, $event)">
                  <mat-icon>picture_as_pdf</mat-icon>
                </button>
                </td>
            </ng-container>

            <ng-container matColumnDef="titulo">
                <td mat-cell *matCellDef="let row" class="corFonte">
                {{ row.titulo || '—' }}
                </td>
            </ng-container>

            <ng-container matColumnDef="descricao">
                <td mat-cell *matCellDef="let row" class="corFonte">
                {{ row.descricao || '—' }}
                </td>
            </ng-container>



            <tr style="min-height: 30px!important; height: 30px!important;"
                mat-row
                *matRowDef="let row; columns: displayedColumns;"
                (click)="anamneseEditar(row)">
            </tr>
          
        </table>
        
        <div class="empty" *ngIf="!carregandoAnamneses && dataSource.data.length === 0" >
          Aluno sem anamneses.
        </div>

      </div>
    </main>
  </div>
</div>
