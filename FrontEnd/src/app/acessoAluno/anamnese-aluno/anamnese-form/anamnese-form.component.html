<mat-toolbar color="primary" style="margin-bottom: 10px; margin-top: 5px;">
  <button mat-icon-button style="display: flex; width: 20px !important; height: 20px !important; align-items: center !important; justify-content: center !important; background-color: black; padding: 7px; margin-right: 10px;" (click)="fechar()">
    <mat-icon style="display: flex; align-items: center !important; justify-content: center !important;">arrow_back</mat-icon>
  </button>
  <span style="font-size: 16px !important; padding: 2px;">Cadastro de Anamnese</span>
</mat-toolbar>

<div style="margin-bottom: 25px; margin-left: 5px;" class="form-wrapper">
  <form *ngIf="form" [formGroup]="form">

    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Data</mat-label>

      <input matInput [matDatepicker]="pickerDataAnamnese" formControlName="dataAnamnese" readonly>
      <mat-datepicker #pickerDataAnamnese readonly></mat-datepicker>
    </mat-form-field>


    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo" readonly/>
    </mat-form-field>

    <mat-card class="peso-card">
      <div class="peso-container">
        <mat-form-field appearance="fill" class="peso-kg">
          <mat-label>Idade (anos)</mat-label>
          <input matInput formControlName="idade" readonly/>
        </mat-form-field>

        <mat-form-field appearance="fill" class="peso-g">
          <mat-label>Altura (m)</mat-label>
          <input matInput formControlName="altura" readonly/>
        </mat-form-field>
      </div>

    </mat-card>   

    <mat-card class="peso-card">
      <mat-card-subtitle>Peso corporal</mat-card-subtitle>

      <div class="peso-container">
        <mat-form-field appearance="fill" class="peso-kg">
          <mat-label>Kg</mat-label>
          <input matInput formControlName="pesoKg" readonly/>
        </mat-form-field>

        <mat-form-field appearance="fill" class="peso-g">
          <mat-label>gramas</mat-label>
          <input matInput formControlName="pesoG" readonly/>
        </mat-form-field>
      </div>

      <div class="peso-total">
        Peso total: <strong>{{ getPesoTotal() | number:'1.3-3' }} kg</strong>
      </div>
    </mat-card>   


    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Qual é o Objetivo ?</mat-label>
      <input matInput formControlName="objetivo" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Principal Reclamação</mat-label>
      <input matInput formControlName="principalRecl" readonly/>
    </mat-form-field>

    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Hábitos Alimentares</mat-label>
      <input matInput formControlName="alimentacao" readonly/>
    </mat-form-field>

    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Medicamentos</mat-label>
      <input matInput formControlName="medicamentos" readonly/>
    </mat-form-field>

    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Histórico de Saúde</mat-label>
      <input matInput formControlName="historicosaude"readonly />
    </mat-form-field>

    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Fatores de Risco</mat-label>
      <input matInput formControlName="fatoresrisco" readonly/>
    </mat-form-field>

    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Como tem sido o Sono</mat-label>
      <input matInput formControlName="sono" readonly/>
    </mat-form-field>

    <mat-form-field appearance="fill" class="peso-card">
      <mat-label>Descrição</mat-label>
      <input matInput formControlName="descricao" readonly/>
    </mat-form-field>

  </form>
</div>
