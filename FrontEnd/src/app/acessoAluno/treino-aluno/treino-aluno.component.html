
<div class="page" >

  <div class="filtros">

    <span class="titulo">Meus Treinos</span>


    <!-- seletor de mês (apenas mês/ano) -->

    <mat-dialog-content >
      <mat-form-field appearance="fill">
        <mat-label>Mês Filtro:</mat-label>
        <mat-select 
          [(value)]="mesSelecionadoLabel" 
          (selectionChange)="onMonthSelected($event)">
          <mat-option *ngFor="let mes of meses" [value]="mes">
            {{ mes.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </mat-dialog-content>
    <span class="spacer"></span>
  </div>


  <div class="agenda-layout" >

    <main class="content">

      <div class="tabela-container">
        <table mat-table [dataSource]="[]" class="tabela-header">
            <ng-container matColumnDef="treino">
                <th mat-header-cell *matHeaderCellDef>Treino</th>
            </ng-container>

            <ng-container matColumnDef="data">
                <th mat-header-cell *matHeaderCellDef>Data</th>
            </ng-container>

            <ng-container matColumnDef="concluido">
                <th mat-header-cell *matHeaderCellDef>Concluído</th>
            </ng-container>


            <tr mat-header-row *matHeaderRowDef="['data','treino','concluido']" style="height: 32px !important;"></tr>
        </table>
      
      <div class="tabela-wrap" *ngIf="alunoid">
        <div class="loading" *ngIf="carregandoAlunosTreinos">
          <mat-progress-spinner mode="indeterminate" diameter="32"></mat-progress-spinner>
        </div>

        <table mat-table 
              [dataSource]="dataSource"
              cdkDropList
              *ngIf="!carregandoAlunosTreinos">

            <ng-container matColumnDef="treino">
                <td mat-cell *matCellDef="let row" class="corFonte">
                {{ row?.treino }} 
                </td>
            </ng-container>

            <ng-container matColumnDef="data">
                <td mat-cell *matCellDef="let row" class="corFonte">
                <span *ngIf="row?.data"> 
                  {{ toDate(row?.data) | date:'dd/MM/yy' }} 
                </span> 
                </td>
            </ng-container>

            <ng-container matColumnDef="concluido">
                <td mat-cell *matCellDef="let row" class="corFonte">
                {{ row?.concluido ? '✅ Sim' : '❌ Não' }}
                </td>
            </ng-container>

            <tr style="min-height: 30px!important; height: 30px!important;"
                mat-row
                *matRowDef="let row; columns: displayedColumns;"
                (click)="treino(row)">
            </tr>

          
        </table>
        
        <div class="empty" *ngIf="!carregandoAlunosTreinos && dataSource.data.length === 0" >
          Sem treinos para o filtro selecionado: <br>
          Mês/Ano: {{this.mesFormatado}}
        </div>

      </div>
    </div>
    </main>
  </div>

</div>
